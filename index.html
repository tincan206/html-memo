<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HTML 서고</title>
<style>
  :root{
    --bg: #1c1f26;
    --panel: #23272f;
    --card: #eee7d8;
    --card-text: #2a251c;
    --ink: #e9e6dd;
    --ink-dim: #9aa0ab;
    --accent: #c98a2c;
    --accent-soft: #c98a2c33;
    --line: #333844;
    --danger: #b5533f;
    --side-padding: 16px;
    --banner-bg: #3a2f1a;
    --banner-border: #5a4a26;
    --banner-text: #e9d9ab;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html.theme-light{
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #262319;
    --ink-dim: #7a7263;
    --line: #e2dcc9;
    --accent: #a8681d;
    --accent-soft: #a8681d22;
    --danger: #a8402e;
    --banner-bg: #fdf1d6;
    --banner-border: #e6cf9a;
    --banner-text: #6b5424;
  }
  *{box-sizing:border-box;}
  html, body{
    touch-action: pan-x pan-y;
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header{
    padding-top:5px;
    padding-bottom:5px;
    padding-left:var(--side-padding);
    padding-right:var(--side-padding);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .header-top-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }
  #collapseHeaderBtn{
    font-size:11px;
    padding:8px 10px;
  }
  h1{
    margin:0;
    font-family: Georgia, "Nanum Myeongjo", serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .header-extra{
    margin-top:8px;
  }
  body.header-collapsed .header-extra{
    display:none;
  }
  .sub{
    color:var(--ink-dim);
    font-size:12.5px;
    margin-bottom:12px;
  }
  .toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  input[type=text], select, textarea{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:6px;
    padding:8px 10px;
    font-size:13.5px;
    font-family:inherit;
  }
  input[type=text]:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  .search{flex:1; min-width:120px;}
  button{
    background:var(--accent);
    color:#1c1f26;
    border:none;
    border-radius:6px;
    padding:8px 14px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  button.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
    font-weight:500;
  }
  button.danger{
    background:transparent;
    color:var(--danger);
    border:1px solid var(--danger);
    font-weight:500;
  }
  button:hover{filter:brightness(1.08);}
  .chips{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .chip{
    padding:5px 11px;
    border-radius:14px;
    border:1px solid var(--line);
    font-size:12px;
    cursor:pointer;
    color:var(--ink-dim);
  }
  .chip.active{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-soft);
  }
  main{
    flex:1;
    display:flex;
    overflow:hidden;
  }
  .list{
    width:280px;
    flex-shrink:0;
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:10px 14px;
    margin-left:var(--side-padding);
  }
  .item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .item:hover{border-color:var(--accent);}
  .item.active{border-color:var(--accent); background:var(--accent-soft);}
  .item-title{font-size:13.5px; font-weight:600; margin-bottom:4px; overflow-wrap:break-word;}
  .item-meta{font-size:11px; color:var(--ink-dim); display:flex; justify-content:space-between;}
  .item-cat{color:var(--accent);}
  .empty-list{color:var(--ink-dim); font-size:12.5px; padding:20px 8px; text-align:center;}
  .detail{
    flex:1;
    overflow-y:auto;
    padding-top:20px;
    padding-bottom:20px;
    padding-left:var(--side-padding);
    padding-right:var(--side-padding);
  }
  .placeholder{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-dim);
    font-size:14px;
  }
  .field-row{display:flex; gap:10px; margin-bottom:10px;}
  .field-row input[type=text]{flex:1;}
  label{
    display:block;
    font-size:11.5px;
    color:var(--ink-dim);
    margin-bottom:4px;
  }
  .field{margin-bottom:14px;}
  textarea#htmlInput{
    width:100%;
    height:220px;
    resize:vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:12.5px;
    line-height:1.5;
    white-space:pre;
  }
  .actions{display:flex; gap:8px; margin-bottom:18px;}
  .tab-card{
    background:var(--card);
    color:var(--card-text);
    border-radius:4px 10px 10px 10px;
    position:relative;
    margin:22px 0 18px;
  }
  .tab{
    position:absolute;
    top:-20px; left:14px;
    background:var(--card);
    padding:5px 14px 3px;
    border-radius:6px 6px 0 0;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.3px;
    color:#6b5a2e;
  }
  .preview-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 16px;
    border-bottom:1px solid #d9d0b8;
    font-size:12px;
    color:#6b6152;
  }
  iframe{
    width:100%;
    height:78vh;
    border:none;
    background:#fff;
    display:block;
    border-radius:0 0 10px 10px;
  }
  .meta-line{
    font-size:11.5px;
    color:var(--ink-dim);
    margin:-6px 0 16px;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,11,14,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    width:340px;
    max-width:90vw;
    padding:18px 20px;
  }
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .modal-title{
    font-family: Georgia, "Nanum Myeongjo", serif;
    font-size:17px;
    font-weight:600;
  }
  .modal-section{
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .modal-section:last-child{
    border-bottom:none;
    margin-bottom:0;
    padding-bottom:0;
  }
  .modal-section > label{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:8px;
  }
  .range-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .range-row input[type=range]{
    flex:1;
    accent-color: var(--accent);
    background:transparent;
    padding:0;
  }
  .range-row span{
    font-size:12px;
    color:var(--ink-dim);
    width:52px;
    text-align:right;
  }
  .hint{
    font-size:11px;
    color:var(--ink-dim);
    margin-top:8px;
  }
  .modal-actions{
    display:flex;
    gap:8px;
  }
  .modal-actions button.selected{
    background:var(--accent);
    color:var(--bg);
    border-color:var(--accent);
  }
  .banner{
    background:var(--banner-bg);
    border-bottom:1px solid var(--banner-border);
    color:var(--banner-text);
    font-size:12.5px;
    padding-top:9px;
    padding-bottom:9px;
    padding-left:var(--side-padding);
    padding-right:var(--side-padding);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .banner button{
    padding:3px 10px;
    font-size:11.5px;
    flex-shrink:0;
  }

  /* 목록 접기 (데스크톱/모바일 공통 수동 토글) */
  body.list-hidden .list{ display:none; }

  /* 모바일 상단 뒤로가기 바 (기본은 숨김) */
  .mobile-topbar{
    display:none;
    align-items:center;
    gap:12px;
    padding-top:10px;
    padding-bottom:10px;
    padding-left:var(--side-padding);
    padding-right:var(--side-padding);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .mobile-topbar button{
    padding:6px 12px;
    font-size:13px;
  }
  #mobileTopbarTitle{
    font-size:13px;
    font-weight:600;
    color:var(--ink-dim);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* 좁은 화면: 목록/본문을 화면 하나씩 전환하는 방식으로 전환 */
  @media (max-width: 720px){
    body.compact{ --side-padding: min(var(--side-padding), 40px); }
    header{ padding-top:5px; padding-bottom:5px; padding-left:var(--side-padding); padding-right:var(--side-padding); }
    h1{ font-size:18px; }
    .header-top-actions{ gap:6px; }
    .header-top-actions button{ padding:7px 9px; font-size:12.5px; }
    #toggleListBtn{ display:none; } /* 모바일에서는 자동 전환이 대신함 */

    main{ position:relative; }
    body.compact .list{
      width:100%;
      margin-left:0;
      display:block;
    }
    body.compact .detail{
      display:none;
    }
    body.compact.show-detail .list{
      display:none;
    }
    body.compact.show-detail .detail{
      display:block;
    }
    body.compact.show-detail .mobile-topbar{
      display:flex;
    }
    body.compact .field-row{
      flex-direction:column;
    }
    body.compact .field-row > div{
      width:100% !important;
    }
    body.compact iframe{
      height:65vh;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>HTML 서고</h1>
    <div class="header-top-actions">
      <button id="newBtn">+ 새 메모</button>
      <button class="ghost" id="toggleListBtn" title="목록 접기/펼치기">☰</button>
      <button class="ghost" id="settingsBtn" title="설정">⚙️</button>
      <button class="ghost" id="collapseHeaderBtn" title="설명/검색 영역 접기/펼치기">▾</button>
    </div>
  </div>
  <div class="header-extra" id="headerExtra">
    <div class="toolbar">
      <input type="text" class="search" id="searchBox" placeholder="제목으로 검색...">
    </div>
    <div class="chips" id="chipRow"></div>
  </div>
</header>

<div class="banner" id="persistBanner" style="display:none;">
  <span id="persistBannerText"></span>
  <button class="ghost" id="dismissBanner">닫기</button>
</div>

<div class="mobile-topbar" id="mobileTopbar">
  <button class="ghost" id="backToListBtn">← 목록</button>
  <span id="mobileTopbarTitle"></span>
</div>

<main id="mainArea">
  <div class="list" id="listPane"></div>
  <div class="detail" id="detailPane">
    <div class="placeholder">왼쪽에서 메모를 선택하거나, ‘새 메모’를 눌러 시작하세요</div>
  </div>
</main>

<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">설정</span>
      <button class="ghost" id="closeSettingsBtn">닫기</button>
    </div>

    <div class="modal-section">
      <label>화면 모드</label>
      <div class="modal-actions">
        <button class="ghost" id="themeDarkBtn">다크</button>
        <button class="ghost" id="themeLightBtn">라이트</button>
      </div>
    </div>

    <div class="modal-section">
      <label>좌우 여백</label>
      <div class="range-row">
        <input type="range" id="paddingRange" min="0" max="400" step="4">
        <span id="paddingValueLabel">16px</span>
      </div>
      <div class="hint">본문·미리보기 영역의 좌우 여백을 조절해요</div>
    </div>

    <div class="modal-section">
      <label>백업 / 복구</label>
      <div class="modal-actions">
        <button id="settingsBackupBtn">백업 파일 내려받기</button>
        <button class="ghost" id="settingsRestoreBtn">백업 파일로 복구</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json" style="display:none">
      <div class="hint">복구 시 기존 메모에 추가할지, 전부 교체할지 선택할 수 있어요</div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'archive-notes';
let notes = [];
let currentId = null;
let activeCategory = null;
let dirty = false;

// 이 파일이 Claude 아티팩트 패널 안이 아니라 일반 브라우저에서 독립 파일로 열렸을 때는
// window.storage(아티팩트 전용 API)가 존재하지 않는다. 그 경우 브라우저의 localStorage로 자동 전환한다.
// 단, 채팅 내 미리보기(샌드박스)처럼 localStorage 접근마저 차단된 환경도 있어
// 최후 수단으로 메모리 저장(새로고침 시 사라짐)까지 3단계로 대비한다.
const USE_ARTIFACT_STORAGE = (typeof window.storage !== 'undefined');
let memoryStore = {};
let persistenceMode = 'checking'; // 'artifact' | 'local' | 'memory'

function tryLocalGet(key){
  try{ return { ok:true, value: localStorage.getItem(key) }; }
  catch(e){ return { ok:false }; }
}
function tryLocalSet(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ return false; }
}

async function storageGet(key){
  if(USE_ARTIFACT_STORAGE){
    try{
      const res = await window.storage.get(key, false);
      persistenceMode = 'artifact';
      return res ? res.value : null;
    }catch(e){
      // 키가 없어서 나는 에러일 수도 있고, 이 환경의 저장소 브릿지가 불안정할 수도 있다.
      // 어느 쪽이든 로컬 저장소로 안전하게 이어간다.
    }
  }
  const local = tryLocalGet(key);
  if(local.ok){
    persistenceMode = 'local';
    return local.value;
  }
  persistenceMode = 'memory';
  return (memoryStore[key] !== undefined) ? memoryStore[key] : null;
}

async function storageSet(key, value){
  if(USE_ARTIFACT_STORAGE){
    try{
      const result = await window.storage.set(key, value, false);
      if(result){
        persistenceMode = 'artifact';
        return;
      }
    }catch(e){
      console.warn('아티팩트 저장소 응답이 불안정해서 로컬 저장으로 전환합니다:', e);
      // 아래로 이어져 localStorage/메모리로 폴백
    }
  }
  if(tryLocalSet(key, value)){
    persistenceMode = 'local';
    return;
  }
  // localStorage조차 막힌 환경(예: 채팅 내 샌드박스 미리보기) — 조용히 메모리로 대체
  memoryStore[key] = value;
  persistenceMode = 'memory';
}

let storageAvailable = true;

async function loadNotes(){
  const raw = await storageGet(STORAGE_KEY);
  try{
    notes = raw ? JSON.parse(raw) : [];
  }catch(e){
    notes = [];
  }
}

async function persist(){
  const payload = JSON.stringify(notes);
  const sizeMB = new Blob([payload]).size / (1024*1024);
  if(sizeMB > 4.5){
    throw new Error(`저장 용량이 너무 커요 (약 ${sizeMB.toFixed(1)}MB / 최대 5MB). 백업 후 오래된 메모를 정리해주세요.`);
  }
  await storageSet(STORAGE_KEY, payload);
}

function uid(){
  return 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function getCategories(){
  const set = new Set();
  notes.forEach(n => { if(n.category) set.add(n.category); });
  return Array.from(set).sort();
}

function renderChips(){
  const row = document.getElementById('chipRow');
  const cats = getCategories();
  let html = `<div class="chip ${activeCategory===null?'active':''}" data-cat="">전체 (${notes.length})</div>`;
  cats.forEach(c => {
    const count = notes.filter(n=>n.category===c).length;
    html += `<div class="chip ${activeCategory===c?'active':''}" data-cat="${escapeAttr(c)}">${escapeHtml(c)} (${count})</div>`;
  });
  row.innerHTML = html;
  row.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeCategory = el.dataset.cat || null;
      renderChips();
      renderList();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

function renderList(){
  const pane = document.getElementById('listPane');
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  let filtered = notes.slice().sort((a,b)=>b.updatedAt - a.updatedAt);
  if(activeCategory) filtered = filtered.filter(n=>n.category===activeCategory);
  if(q) filtered = filtered.filter(n=>n.title.toLowerCase().includes(q));

  if(filtered.length===0){
    pane.innerHTML = `<div class="empty-list">저장된 메모가 없어요</div>`;
    return;
  }
  pane.innerHTML = filtered.map(n => `
    <div class="item ${n.id===currentId?'active':''}" data-id="${n.id}">
      <div class="item-title">${escapeHtml(n.title || '(제목 없음)')}</div>
      <div class="item-meta">
        <span class="item-cat">${escapeHtml(n.category || '미분류')}</span>
        <span>${fmtDate(n.updatedAt)}</span>
      </div>
    </div>
  `).join('');
  pane.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click', ()=> openNote(el.dataset.id));
  });
}

function openNote(id){
  currentId = id;
  const note = notes.find(n=>n.id===id);
  renderList();
  renderDetail(note);
  showDetailView(note ? note.title : '');
}

function newNote(){
  currentId = null;
  renderList();
  renderDetail(null);
  showDetailView('새 메모');
}

function showDetailView(title){
  document.body.classList.add('show-detail');
  const label = document.getElementById('mobileTopbarTitle');
  if(label) label.textContent = title || '';
}

function showListView(){
  document.body.classList.remove('show-detail');
}

function renderDetail(note){
  const pane = document.getElementById('detailPane');
  const isNew = !note;
  const title = note ? note.title : '';
  const category = note ? note.category : '';
  const html = note ? note.html : '';
  const cats = getCategories();
  const catExists = category && cats.includes(category);

  const categoryFieldHtml = `
    <div style="width:200px">
      <label>카테고리</label>
      <select id="categorySelect">
        <option value="미분류" ${(!category || category==='미분류') ? 'selected' : ''}>미분류</option>
        ${cats.filter(c=>c!=='미분류').map(c=>`<option value="${escapeAttr(c)}" ${c===category?'selected':''}>${escapeHtml(c)}</option>`).join('')}
        ${(category && !catExists && category!=='미분류') ? `<option value="${escapeAttr(category)}" selected>${escapeHtml(category)}</option>` : ''}
        <option value="__new__">+ 새 카테고리 추가</option>
      </select>
      <input type="text" id="categoryNewInput" style="display:none; margin-top:6px; width:100%;" placeholder="새 카테고리 이름">
    </div>
  `;

  const fieldsHtml = `
    <div class="field-row">
      <div style="flex:1">
        <label>제목</label>
        <input type="text" id="titleInput" value="${escapeAttr(title)}" placeholder="예: 랜딩페이지 v1">
      </div>
      ${categoryFieldHtml}
    </div>
    ${note ? `<div class="meta-line">마지막 수정: ${fmtDate(note.updatedAt)}</div>` : ''}
    <div class="field">
      <label>HTML 본문</label>
      <textarea id="htmlInput" placeholder="&lt;!DOCTYPE html&gt;...&lt;/html&gt; 형태의 HTML을 붙여넣으세요">${escapeHtml(html)}</textarea>
    </div>
    <div class="actions">
      <button id="saveBtn">${isNew ? '저장' : '수정 저장'}</button>
      <button class="ghost" id="previewBtn">미리보기 실행</button>
      ${!isNew ? `<button class="danger" id="deleteBtn">삭제</button>` : ''}
    </div>
  `;

  const previewSlot = `<div id="previewWrap"></div>`;

  // 새 메모: 본문 입력이 위, 미리보기가 아래
  // 저장된 메모를 열람: 미리보기가 위, 본문 입력이 아래
  pane.innerHTML = isNew
    ? fieldsHtml + previewSlot
    : previewSlot + fieldsHtml;

  document.getElementById('saveBtn').addEventListener('click', ()=> saveNote(note));
  document.getElementById('previewBtn').addEventListener('click', ()=> runPreview());
  if(!isNew){
    document.getElementById('deleteBtn').addEventListener('click', ()=> deleteNote(note.id));
  }

  const catSelect = document.getElementById('categorySelect');
  const catNewInput = document.getElementById('categoryNewInput');
  catSelect.addEventListener('change', ()=>{
    if(catSelect.value === '__new__'){
      catSelect.style.display = 'none';
      catNewInput.style.display = 'block';
      catNewInput.value = '';
      catNewInput.focus();
    }
  });

  // 기존 메모를 열면 바로 미리보기도 보여준다
  if(note && note.html){
    runPreview();
  }
}

function getSelectedCategory(){
  const catNewInput = document.getElementById('categoryNewInput');
  if(catNewInput && catNewInput.style.display !== 'none' && catNewInput.value.trim()){
    return catNewInput.value.trim();
  }
  const catSelect = document.getElementById('categorySelect');
  const v = catSelect ? catSelect.value : '';
  return (v && v !== '__new__') ? v : '미분류';
}

// AI가 응답에 ```html ... ``` 코드펜스를 씌워서 붙여넣는 경우가 많아,
// 미리보기 실행 시 이를 제거해서 실제 HTML만 렌더링한다.
function stripCodeFence(str){
  const trimmed = (str || '').trim();
  const m = trimmed.match(/^```(?:html)?\s*\r?\n([\s\S]*?)\r?\n?```\s*$/i);
  return m ? m[1] : str;
}

function runPreview(){
  const rawHtml = document.getElementById('htmlInput').value;
  const htmlVal = stripCodeFence(rawHtml);
  const catVal = getSelectedCategory();
  const wrap = document.getElementById('previewWrap');
  if(!htmlVal.trim()){
    wrap.innerHTML = '';
    return;
  }
  wrap.innerHTML = `
    <div class="tab-card">
      <div class="tab">${escapeHtml(catVal)}</div>
      <div class="preview-head">
        <span>실제 실행 화면</span>
        <span>iframe 샌드박스</span>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-forms"></iframe>
    </div>
  `;
  document.getElementById('previewFrame').srcdoc = htmlVal;
}

async function saveNote(existing){
  const title = document.getElementById('titleInput').value.trim();
  const category = getSelectedCategory();
  const html = document.getElementById('htmlInput').value;

  if(!title){
    alert('제목을 입력해주세요.');
    return;
  }
  if(!html.trim()){
    alert('HTML 본문을 붙여넣어주세요.');
    return;
  }

  const now = Date.now();
  if(existing){
    existing.title = title;
    existing.category = category;
    existing.html = html;
    existing.updatedAt = now;
    currentId = existing.id;
  } else {
    const n = { id: uid(), title, category, html, createdAt: now, updatedAt: now };
    notes.push(n);
    currentId = n.id;
  }
  try{
    await persist();
  }catch(e){
    console.error('저장 실패:', e);
    alert('저장 중 문제가 발생했어요.\n\n원인: ' + (e && e.message ? e.message : e));
    return;
  }
  activeCategory = null;
  renderChips();
  renderList();
  openNote(currentId);
}

async function deleteNote(id){
  if(!confirm('이 메모를 삭제할까요? 되돌릴 수 없어요.')) return;
  notes = notes.filter(n=>n.id!==id);
  await persist();
  currentId = null;
  renderChips();
  renderList();
  renderDetail(null);
  showListView();
}

function downloadBackup(){
  if(notes.length===0){
    alert('백업할 메모가 없어요.');
    return;
  }
  const payload = {
    app: 'html-archive-backup',
    version: 1,
    exportedAt: Date.now(),
    notes: notes
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = fmtDate(Date.now()).replace(/[.\s:]/g,'-');
  a.href = url;
  a.download = `html-archive-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function normalizeImported(raw){
  // 백업 파일 형식({notes:[...]}) 또는 순수 배열 둘 다 지원
  let list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.notes) ? raw.notes : null);
  if(!list) return null;
  const now = Date.now();
  return list
    .filter(n => n && typeof n === 'object' && (n.title || n.html))
    .map(n => ({
      id: typeof n.id === 'string' ? n.id : uid(),
      title: String(n.title || '(제목 없음)'),
      category: String(n.category || '미분류'),
      html: String(n.html || ''),
      createdAt: typeof n.createdAt === 'number' ? n.createdAt : now,
      updatedAt: typeof n.updatedAt === 'number' ? n.updatedAt : now
    }));
}

async function handleRestoreFile(file){
  let parsed;
  try{
    const text = await file.text();
    parsed = JSON.parse(text);
  }catch(e){
    alert('백업 파일을 읽을 수 없어요. JSON 형식이 맞는지 확인해주세요.');
    return;
  }
  const imported = normalizeImported(parsed);
  if(!imported || imported.length===0){
    alert('이 파일에서 복구할 메모를 찾지 못했어요.');
    return;
  }

  const mode = confirm(
    `${imported.length}개의 메모를 찾았어요.\n\n` +
    `확인 = 기존 메모에 추가(병합)\n취소 = 현재 메모를 전부 지우고 이 백업으로 교체`
  );

  if(mode){
    // 병합: 같은 id가 있으면 새 id 부여해서 둘 다 보존
    const existingIds = new Set(notes.map(n=>n.id));
    imported.forEach(n=>{
      if(existingIds.has(n.id)) n.id = uid();
      notes.push(n);
    });
  } else {
    if(!confirm('정말로 현재 메모를 전부 삭제하고 백업으로 교체할까요? 되돌릴 수 없어요.')) return;
    notes = imported;
  }

  await persist();
  currentId = null;
  activeCategory = null;
  renderChips();
  renderList();
  newNote();
  alert('복구가 완료됐어요.');
}

const SETTINGS_KEY = 'archive-settings';
let settings = { sidePadding: 16, theme: 'dark', headerCollapsed: false };

async function loadSettings(){
  const raw = await storageGet(SETTINGS_KEY);
  try{
    if(raw){
      const parsed = JSON.parse(raw);
      if(typeof parsed.sidePadding === 'number') settings.sidePadding = parsed.sidePadding;
      if(parsed.theme === 'light' || parsed.theme === 'dark') settings.theme = parsed.theme;
      if(typeof parsed.headerCollapsed === 'boolean') settings.headerCollapsed = parsed.headerCollapsed;
    }
  }catch(e){ /* 기본값 사용 */ }
  applySidePadding();
  applyTheme();
  applyHeaderCollapsed();
}

async function saveSettings(){
  try{
    await storageSet(SETTINGS_KEY, JSON.stringify(settings));
  }catch(e){
    console.error('설정 저장 실패:', e);
  }
}

function applySidePadding(){
  document.documentElement.style.setProperty('--side-padding', settings.sidePadding + 'px');
  const range = document.getElementById('paddingRange');
  const label = document.getElementById('paddingValueLabel');
  if(range) range.value = settings.sidePadding;
  if(label) label.textContent = settings.sidePadding + 'px';
}

function applyTheme(){
  document.documentElement.classList.toggle('theme-light', settings.theme === 'light');
  const darkBtn = document.getElementById('themeDarkBtn');
  const lightBtn = document.getElementById('themeLightBtn');
  if(darkBtn && lightBtn){
    darkBtn.classList.toggle('selected', settings.theme !== 'light');
    lightBtn.classList.toggle('selected', settings.theme === 'light');
  }
}

function applyHeaderCollapsed(){
  document.body.classList.toggle('header-collapsed', settings.headerCollapsed);
  const btn = document.getElementById('collapseHeaderBtn');
  if(btn) btn.textContent = settings.headerCollapsed ? '▸' : '▾';
}

function openSettings(){
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('open');
}

document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
document.getElementById('settingsOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'settingsOverlay') closeSettings();
});
document.getElementById('paddingRange').addEventListener('input', (e)=>{
  settings.sidePadding = Number(e.target.value);
  applySidePadding();
});
document.getElementById('paddingRange').addEventListener('change', ()=> saveSettings());

document.getElementById('themeDarkBtn').addEventListener('click', ()=>{
  settings.theme = 'dark';
  applyTheme();
  saveSettings();
});
document.getElementById('themeLightBtn').addEventListener('click', ()=>{
  settings.theme = 'light';
  applyTheme();
  saveSettings();
});

document.getElementById('newBtn').addEventListener('click', newNote);

// 좁은 화면(모바일)에서는 목록/본문을 한 화면씩 전환하는 방식으로 동작한다.
function updateCompactMode(){
  const compact = window.innerWidth <= 720;
  document.body.classList.toggle('compact', compact);
}
window.addEventListener('resize', updateCompactMode);

document.getElementById('toggleListBtn').addEventListener('click', ()=>{
  document.body.classList.toggle('list-hidden');
});
document.getElementById('backToListBtn').addEventListener('click', showListView);
document.getElementById('collapseHeaderBtn').addEventListener('click', ()=>{
  settings.headerCollapsed = !settings.headerCollapsed;
  applyHeaderCollapsed();
  saveSettings();
});

document.getElementById('searchBox').addEventListener('input', renderList);
document.getElementById('settingsBackupBtn').addEventListener('click', downloadBackup);
document.getElementById('settingsRestoreBtn').addEventListener('click', ()=> document.getElementById('restoreFile').click());
document.getElementById('restoreFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) handleRestoreFile(file);
  e.target.value = '';
});

// 트랙패드 핀치 제스처는 브라우저가 ctrl+wheel로 합성해서 보내는 경우가 많아
// 실제로 ctrl 키를 누르지 않았어도 화면이 확대되는 것처럼 보인다. 여기서 가로채 막는다.
window.addEventListener('wheel', function(e){
  if(e.ctrlKey){
    e.preventDefault();
  }
}, { passive: false });

function showPersistBanner(mode){
  const banner = document.getElementById('persistBanner');
  const text = document.getElementById('persistBannerText');
  if(mode === 'memory'){
    text.textContent = '지금 화면은 저장이 임시로만 유지돼요 (새로고침하면 사라져요). 이 파일을 다운로드해서 브라우저에서 직접 열면 완전히 저장돼요.';
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

document.getElementById('dismissBanner').addEventListener('click', ()=>{
  document.getElementById('persistBanner').style.display = 'none';
});

(async function init(){
  updateCompactMode();
  await loadNotes();
  await loadSettings();
  renderChips();
  renderList();
  showPersistBanner(persistenceMode);
})();
</script>
